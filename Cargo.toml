[package]
name = "mdterm"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven Markdown and plain-text viewer/editor for terminals"
license = "MIT"
repository = "https://github.com/mfontcada/mdterm"

[dependencies]
comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }
scraper = { version = "0.27", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"
